name: Site audits

# Only when the docs site changes. It is a separate workflow rather than a job
# in test.yml because the two have nothing in common: this one builds
# `packages/landing/`, which no change to the proxy can affect, and pulls in
# ~100 MB of `lighthouse` that the proxy's own suites have no use for. Keeping
# it apart means a change to `packages/test-proxy-recorder/` pays for neither.
#
# Two gates run here, in that order: the accessibility suite (axe-core plus
# rendered contrast, both themes) and then Lighthouse, which is held back so
# the timing measurement has the runner to itself.
on:
  push:
    branches:
      - master
    paths:
      - 'packages/landing/**'
      - '.github/workflows/lighthouse.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'packages/landing/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:

jobs:
  audits:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to a commit SHA with the tag in the trailing comment,
      # as everywhere else in this repo. Resolve a tag with:
      #   gh api repos/actions/checkout/commits/v7.0.1 --jq .sha
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # `cache: pnpm` needs pnpm already on PATH, which is why the step above
      # comes first. setup-node v6 limited *automatic* caching to npm; passing
      # `cache` explicitly is unaffected and pnpm is still a supported value.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--filter landing`, not a bare `pnpm exec`: `@playwright/test` is a
      # dependency of the landing package, not of the workspace root, so the
      # binary is only on the path inside that package.
      - name: Install Playwright chromium
        run: pnpm --filter landing exec playwright install --with-deps chromium

      # Builds the site once, then runs both gates against the preview server —
      # one page per template, ~1m on top of the build. The build is part of the
      # suite's webServer block, so there is no separate build step here.
      #
      # Performance is a timing measurement and this runner is shared. The
      # Lighthouse project runs serially for that reason; if the score starts
      # flaking here while holding locally, lower that one threshold in the spec
      # rather than dropping the assertion — the other three categories are
      # deterministic, as is the whole accessibility gate, and they are the
      # reason this job exists.
      - name: Site audits
        run: pnpm run landing:audits

      # Playwright leaves an error context per failure. For a score that only
      # drops on the runner, that is the only record of which audit gave way.
      - name: Upload audit results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-results
          path: packages/landing/test-results/
          retention-days: 7
          if-no-files-found: ignore
